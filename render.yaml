services:
  - type: web
    name: reservaupla-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: reservaupla-db
          property: connectionString
      - key: Cors__FrontendUrl
        value: https://jack964272749.github.io
      - key: Seeder__AdminPassword
        sync: false
      - key: Seeder__RespPassword
        sync: false
      - key: Seeder__SolicPassword
        sync: false

databases:
  - name: reservaupla-db
    databaseName: reservaupladb
    user: upla_user
    plan: free
    region: oregon
